<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>Suchmaschinen kennenlernen</title>
    <style>
        /* ===== Lern-Kit (gemeinsam für DM-6-Lernumgebungen) ===== */
        :root {
            --ink: #1f1a2e; --muted: #5d5670; --line: #e6e1ee; --card: #fff;
            --ok: #15803d; --ok-soft: #dcfce7; --bad: #be123c; --bad-soft: #ffe4e6;
            --r: 20px;
            --font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; height: 100%; }
        body {
            font-family: var(--font); color: var(--ink); background: var(--bg);
            display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }
        button, input, select, textarea { font-family: inherit; }
        .top {
            flex-shrink: 0; height: 58px; display: flex; align-items: center; gap: 14px;
            padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
            background: var(--hero); color: #fff;
        }
        .brand {
            display: flex; align-items: center; gap: 8px; background: none; border: 0; color: inherit;
            font-weight: 900; font-size: 1.05rem; min-height: 44px; cursor: pointer; padding: 0; white-space: nowrap;
        }
        .brand .ico { font-size: 1.45rem; }
        .prog { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 90px; }
        .prog .track { flex: 1; height: 10px; background: rgba(255,255,255,.22); border-radius: 99px; overflow: hidden; }
        .prog .fill { height: 100%; width: 0; background: var(--hero-accent, #fff); border-radius: 99px; transition: width .4s; }
        .prog .num { font-weight: 800; font-size: .88rem; white-space: nowrap; opacity: .95; }
        .chips {
            flex-shrink: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
            padding: 8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
            background: rgba(255,255,255,.82); border-bottom: 1px solid var(--line);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            display: flex; align-items: center; gap: 8px; flex-shrink: 0; min-height: 44px;
            padding: 4px 14px 4px 4px; border-radius: 99px; border: 2px solid var(--line);
            background: #fff; color: var(--ink); font-weight: 750; font-size: .92rem;
            cursor: pointer; touch-action: manipulation; white-space: nowrap;
        }
        .chip b {
            width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
            background: var(--soft); font-size: .95rem;
        }
        .chip.home { padding: 4px 12px; font-size: 1.15rem; }
        .chip.on { border-color: var(--accent); background: var(--soft); }
        .chip.on b { background: var(--accent); color: var(--on-accent); }
        .chip.ok b { background: var(--ok); color: #fff; }
        .chip .st { font-size: .7rem; }
        main {
            flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
            padding: 20px max(16px, env(safe-area-inset-right)) 36px max(16px, env(safe-area-inset-left));
        }
        .wrap { max-width: 880px; margin: 0 auto; }
        .foot {
            flex-shrink: 0; display: flex; gap: 10px; align-items: center; justify-content: space-between;
            padding: 10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            background: #fff; border-top: 1px solid var(--line);
        }
        .foot .mid { flex: 1; text-align: center; font-size: .9rem; color: var(--muted); font-weight: 750; line-height: 1.3; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            min-height: 50px; padding: 12px 22px; border-radius: 16px; border: 0;
            background: var(--accent); color: var(--on-accent); font-weight: 850; font-size: 1.02rem;
            cursor: pointer; box-shadow: 0 4px 0 var(--accent-deep); touch-action: manipulation;
            text-decoration: none; line-height: 1.2;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent-deep); }
        .btn.ghost { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
        .btn.ghost:active { transform: none; background: var(--soft); }
        .btn.ok { background: var(--ok); color: #fff; box-shadow: 0 4px 0 #0d5c2b; }
        .btn.white { background: #fff; color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.18); }
        .btn.small { min-height: 44px; padding: 8px 16px; font-size: .95rem; }
        .btn:disabled { opacity: .45; box-shadow: none; transform: none; cursor: default; }
        .linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: .9rem; min-height: 44px; cursor: pointer; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
        .actions.center { justify-content: center; }
        .center { text-align: center; }

        .s-hero {
            background: var(--hero); color: #fff; border-radius: 24px; padding: 22px;
            margin-bottom: 16px; box-shadow: 0 12px 28px var(--shadow, rgba(40,20,80,.18));
        }
        .s-hero h1 { margin: 10px 0 10px; font-size: 1.6rem; line-height: 1.2; }
        .s-hero .lead { font-size: 1.1rem; line-height: 1.5; margin: 0; opacity: .95; }
        .home-hero { text-align: center; padding: 28px 22px; }
        .home-hero .big-ico { font-size: 3.4rem; line-height: 1; }
        .home-hero .stars-total { margin-top: 12px; font-weight: 850; }
        .kicker { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.2); border-radius: 99px; padding: 5px 11px; font-weight: 800; font-size: .82rem; }
        .goal { margin: 0; background: rgba(255,255,255,.16); border-radius: 14px; padding: 10px 12px; font-weight: 650; line-height: 1.45; }

        .block {
            background: var(--card); border-radius: var(--r); padding: 20px; margin-bottom: 14px;
            border: 1px solid var(--line); box-shadow: 0 8px 22px rgba(30,20,60,.05);
        }
        .bh { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 1.12rem; font-weight: 900; line-height: 1.25; }
        .bi { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 1.2rem; background: var(--soft); flex-shrink: 0; }
        .block.learn .bi { background: #e0ecff; }
        .block.task { border-left: 6px solid #f97316; }
        .block.task .bi { background: #ffedd5; }
        .block.play { border-left: 6px solid var(--accent); }
        .block.team { border-left: 6px solid #22c55e; }
        .block.team .bi { background: #dcfce7; }
        .block.info .bi { background: #fef3c7; }
        .block.journal { background: #fffdf2; border-left: 6px solid #eab308; }
        .block.journal .bi { background: #fef3c7; }
        p { line-height: 1.55; font-size: 1.04rem; margin: 0 0 10px; }
        p:last-child { margin-bottom: 0; }
        h3 { margin: 0 0 8px; font-size: 1.08rem; }
        .muted { color: var(--muted); }
        .grid { display: grid; gap: 10px; }
        .grid.two { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
        .grid.three { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
        .tile { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; line-height: 1.45; }
        .tile > b:first-child { display: block; margin-bottom: 3px; }
        .tile.big-tile { font-size: 1.08rem; font-weight: 650; background: var(--soft); border-color: transparent; }
        .num-badge { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-weight: 900; font-size: .9rem; margin-right: 8px; }
        .safe { display: flex; gap: 8px; align-items: flex-start; background: #fff7d6; border-radius: 12px; padding: 10px 12px; margin-top: 12px; font-weight: 750; font-size: .97rem; }
        .steps { margin: 6px 0 0; padding-left: 22px; }
        .steps li { margin-bottom: 7px; line-height: 1.45; font-size: 1.02rem; }
        .roles { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin: 10px 0; }
        .role { background: #f0fdf4; border-radius: 14px; padding: 10px 12px; line-height: 1.4; font-size: .97rem; }
        .role b { display: block; }
        details summary { min-height: 44px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 850; touch-action: manipulation; }
        details[open] summary { margin-bottom: 8px; }

        .choice {
            display: block; width: 100%; text-align: left; background: #fff; color: var(--ink);
            border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 8px;
            min-height: 50px; font-weight: 700; font-size: 1rem; line-height: 1.35; cursor: pointer; touch-action: manipulation;
        }
        .choice:active { background: var(--soft); }
        .choice.good { background: var(--ok-soft); border-color: var(--ok); }
        .choice.bad { background: var(--bad-soft); border-color: var(--bad); }
        .choice:disabled { cursor: default; color: var(--ink); }
        .seg { display: flex; flex-wrap: wrap; gap: 8px; }
        .seg .choice { width: auto; margin-top: 0; flex: 1 1 auto; text-align: center; }
        .seg .choice.sel { border-color: var(--accent); background: var(--soft); }
        .fb { margin-top: 12px; border-radius: 14px; padding: 12px 14px; font-weight: 700; line-height: 1.45; display: none; }
        .fb.show { display: block; }
        .fb.good { background: var(--ok-soft); color: #14532d; }
        .fb.bad { background: var(--bad-soft); color: #881337; }
        .fb.info { background: var(--soft); color: var(--ink); }
        .fb-next { margin-top: 10px; }
        .counter { display: inline-block; background: var(--soft); border-radius: 99px; padding: 5px 12px; font-weight: 850; font-size: .88rem; margin-bottom: 10px; }
        .done-box { text-align: center; padding: 18px; border-radius: 16px; background: var(--ok-soft); color: #14532d; font-weight: 800; line-height: 1.5; }
        .done-box .big { font-size: 2.2rem; }
        input.txt, input.num, select.txt {
            min-height: 48px; border-radius: 12px; border: 2px solid var(--line); padding: 8px 12px;
            font-size: 1.05rem; background: #fff; color: var(--ink); width: 100%;
        }
        input.num { width: 140px; }
        input.txt:focus, input.num:focus, select.txt:focus { outline: none; border-color: var(--accent); }
        .field { margin-bottom: 10px; }
        .field > label { display: block; font-weight: 800; margin-bottom: 5px; font-size: .97rem; }

        .jq { margin-bottom: 14px; }
        .jq label { display: block; font-weight: 800; margin-bottom: 6px; line-height: 1.4; }
        .jq textarea {
            width: 100%; min-height: 86px; border-radius: 14px; border: 2px solid #ece3b8; background: #fff;
            padding: 12px; font-size: 1.02rem; line-height: 1.45; resize: vertical; color: var(--ink);
        }
        .jq textarea:focus { outline: none; border-color: var(--accent); }

        .vocab {
            display: inline-flex; align-items: center; min-height: 34px; padding: 0 4px; margin: 0 1px;
            background: transparent; border: 0; border-bottom: 2px dashed var(--accent);
            color: inherit; font: 800 1em/1.2 var(--font); cursor: pointer; position: relative; touch-action: manipulation;
        }
        .vocab.open { background: var(--soft); border-radius: 8px; }
        .vocab .tip { display: none; }
        /* Erklärung steht als Block unter dem Absatz – ragt nie aus dem Bildschirm */
        .vtip {
            display: block; background: var(--ink); color: #fff; padding: 10px 14px; margin: 4px 0 12px;
            border-radius: 12px; font-weight: 600; font-size: .95rem; line-height: 1.45; text-align: left;
            overflow-wrap: anywhere;
        }

        .home-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
        .st-card {
            display: flex; gap: 12px; align-items: center; text-align: left; background: #fff;
            border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; cursor: pointer;
            min-height: 66px; font: inherit; color: inherit; touch-action: manipulation;
        }
        .st-card:active { background: var(--soft); }
        .st-card .n { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--soft); font-size: 1.3rem; flex-shrink: 0; }
        .st-card.ok .n { background: var(--ok); color: #fff; font-weight: 900; }
        .st-card .t { display: block; font-weight: 850; line-height: 1.25; }
        .st-card .m { display: block; font-size: .84rem; color: var(--muted); font-weight: 650; margin-top: 3px; }
        .part-h { margin: 20px 4px 8px; font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 900; }
        .part-h:first-of-type { margin-top: 4px; }
        .m-res { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-weight: 700; }
        .m-q { margin-top: 10px; }
        .m-q b { display: block; margin-bottom: 4px; }
        .m-q p { white-space: pre-wrap; background: #fafafa; border-radius: 10px; padding: 8px 10px; }
        .print-only { display: none; }

        .toast {
            position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(16px);
            background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 750;
            opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 60;
            max-width: min(520px, 90vw); text-align: center; line-height: 1.4;
        }
        .toast.show { opacity: 1; transform: translateX(-50%); }

        /* Handy-Rahmen für nachgebaute Apps */
        .phone { width: min(360px, 100%); margin: 12px auto 0; background: #111; border-radius: 30px; padding: 10px; box-shadow: 0 14px 30px rgba(0,0,0,.25); }
        .phone-screen { border-radius: 22px; min-height: 440px; position: relative; overflow: hidden; background: #eef4ff; color: #142033; }

        @media (max-width: 640px) {
            .chip span { display: none; }
            .chip { padding: 4px; }
            .chip.home { padding: 4px 10px; }
            .brand .txt { display: none; }
            .s-hero h1 { font-size: 1.35rem; }
            .hide-s { display: none; }
        }
        @media print {
            body { display: block; height: auto; overflow: visible; background: #fff; }
            .top, .chips, .foot, .toast, .no-print { display: none !important; }
            main { overflow: visible; padding: 0; }
            .print-only { display: block; }
            .block { box-shadow: none; break-inside: avoid; border: 1px solid #ccc; }
        }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

        /* ===== Ruhigere Darstellung ===== */
        .chip { padding: 4px; }
        .chip span { display: none; }
        .chip.on { padding: 4px 14px 4px 4px; }
        .chip.on span { display: inline; }
        .chip.home { padding: 4px 10px; }
        .s-hero .goal { background: none; padding: 0; opacity: .92; font-weight: 600; }
        .s-hero h1 { margin-top: 0; }
        .counter { background: none; padding: 0; color: var(--muted); font-weight: 750; font-size: .85rem; display: block; margin-bottom: 6px; }
        .home-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
        .st-card { min-height: 56px; padding: 8px 12px; border-width: 1px; }
        .st-card .n { width: 38px; height: 38px; font-size: 1.15rem; border-radius: 12px; }
        .home-how { color: var(--muted); font-size: .95rem; text-align: center; margin: 18px 8px 6px; }
        .gloss { margin: 0 4px; color: var(--muted); }
        .gloss summary { justify-content: center; }
        .gloss p { font-size: .95rem; }
        .chip:not(.on) { border-color: transparent; background: transparent; }
        .why-box { margin-top: 10px; }
        .why-box label { display: block; font-weight: 800; margin-bottom: 4px; color: var(--ink); }
        .why-t { width: 100%; border-radius: 12px; border: 2px solid var(--line); padding: 8px 10px; font-size: 1rem; background: #fff; resize: vertical; }

        /* ===== Pflicht/Zusatz, Hook, Auflösung ===== */
        .badge { display: inline-block; font-size: .72rem; font-weight: 900; border-radius: 99px; padding: 3px 9px; vertical-align: middle; white-space: nowrap; }
        .badge.req { background: #fee2e2; color: #991b1b; }
        .badge.opt { background: #e0f2fe; color: #075985; }
        .badge.res { background: #ede9fe; color: #5b21b6; }
        .plan { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; margin-bottom: 14px; font-size: .95rem; line-height: 1.5; }
        .plan div + div { margin-top: 2px; }
        .block.hook { border-left: 6px solid #a855f7; }
        .block.hook .bi { background: #f3e8ff; }
        .hook-note { margin-top: 10px; font-size: .9rem; color: var(--muted); }
        .hook-note .linkish { padding: 0 6px; }
        .choice.pick { border-color: var(--accent); background: var(--soft); }
        details.block > summary { list-style: none; font-size: 1.12rem; font-weight: 900; line-height: 1.25; gap: 10px; }
        details.block > summary::-webkit-details-marker { display: none; }
        details.block > summary::after { content: "▾"; margin-left: auto; font-size: 1.1rem; color: var(--muted); transition: transform .2s; }
        details.block[open] > summary::after { transform: rotate(180deg); }
        details.block[open] > summary { margin-bottom: 12px; }
        .jq .badge { margin-right: 4px; }
        .jq.req textarea { border-color: #f4c27a; }
        .jtools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
        .jtools .linkish { padding: 0; }
        .jhint { font-size: .88rem; font-weight: 750; color: var(--muted); }
        .jhint.ok { color: var(--ok); }
        .part-t { display: block; margin-top: 2px; text-transform: none; letter-spacing: 0; font-weight: 750; font-size: .88rem; }
        .st-card .tx { display: block; min-width: 0; }

        /* ===== Thema: Suchmaschinen (Indigo) ===== */
        :root {
            --bg: #eef2ff;
            --hero: linear-gradient(135deg, #3730a3 0%, #5b6ef5 55%, #7c3aed 100%);
            --hero-accent: #fbbf24;
            --accent: #5b6ef5; --on-accent: #fff; --accent-deep: #3d50e0;
            --soft: #e8ebff; --shadow: rgba(91,110,245,.3);
        }
        body { background: linear-gradient(135deg, #e0e7ff 0%, #f0fdf4 55%, #fef9c3 100%); }
        .theory p { line-height: 1.7; }
        .theory ul { line-height: 1.6; padding-left: 22px; margin: 0 0 10px; }
        .theory li { margin-bottom: 8px; }
        .theory a, .task-text a { color: var(--accent-deep); font-weight: 800; }
        .bridge { background: #fff7d6; border-radius: 12px; padding: 10px 12px; font-weight: 700; margin-top: 10px; }

        /* Crawler-Netz */
        .legend { display: flex; gap: 12px; justify-content: center; margin-bottom: 10px; font-size: .88rem; color: var(--muted); font-weight: 700; flex-wrap: wrap; }
        .legend span i { display: inline-block; width: 18px; height: 18px; vertical-align: middle; margin-right: 5px; border-radius: 6px; border: 2px solid transparent; }
        .net { position: relative; width: 100%; max-width: 420px; aspect-ratio: 1; margin: 0 auto; }
        .net svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .pg {
            position: absolute; width: 25%; height: 22%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
            padding: 2px; border-radius: 14px; border: 2px dashed #cbd5e1; background: #f1f5f9; color: #64748b;
            font-weight: 800; font-size: .74rem; line-height: 1.1; text-align: center; cursor: pointer; touch-action: manipulation;
            min-height: 52px; transition: background .2s, border-color .2s;
        }
        .pg .e { font-size: 1.45rem; line-height: 1; }
        .pg.todo { background: #fff; border: 3px solid var(--accent); color: var(--ink); animation: pgpulse 1.2s ease-in-out infinite; }
        .pg.read { background: #bbf7d0; border: 2px solid #22c55e; color: #14532d; }
        .pg.here { box-shadow: 0 0 0 4px var(--accent); }
        .pg.pick { border: 3px solid #f97316; animation: pgpulse 1.2s ease-in-out infinite; }
        .pg.shake { animation: pgshake .35s; }
        @keyframes pgpulse { 50% { transform: translate(-50%, -50%) scale(1.04); } }
        @keyframes pgshake { 25% { transform: translate(-56%, -50%); } 75% { transform: translate(-44%, -50%); } }
        .net-count { text-align: center; font-weight: 850; margin: 10px 0 0; color: var(--ink); }

        /* Such-Simulation / Ergebnisse */
        .serp { background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 14px; }
        .gsearch { display: flex; align-items: center; gap: 8px; border: 2px solid #dfe1e5; border-radius: 99px; padding: 6px 8px 6px 16px; background: #fff; }
        .gsearch input { border: 0; outline: 0; flex: 1; min-width: 0; font-size: 1.05rem; min-height: 40px; background: transparent; }
        .gsearch .q { flex: 1; font-size: 1rem; color: #202124; }
        .glogo { font-size: 2.2rem; font-weight: 900; letter-spacing: -2px; text-align: center; margin: 4px 0 12px; }
        .glogo .b { color: #4285f4; } .glogo .r { color: #ea4335; } .glogo .y { color: #fbbc05; } .glogo .g { color: #34a853; }
        .res { padding: 10px 4px; border-bottom: 1px solid #f1f3f4; }
        .res:last-child { border-bottom: 0; }
        .res .u { color: #188038; font-size: .82rem; font-weight: 600; }
        .res .t { color: #1a0dab; font-size: 1.05rem; font-weight: 700; display: block; }
        .res .s { color: #4d5156; font-size: .93rem; line-height: 1.45; }
        .spons { display: block; font-size: .72rem; font-weight: 800; color: #202124; margin-bottom: 2px; }
        .ad-res { cursor: pointer; border-radius: 12px; transition: opacity .2s, transform .2s; touch-action: manipulation; }
        .ad-res:active { background: #f8fafc; }
        .ad-res.flash { background: var(--bad-soft); }
        .ad-res.gone { opacity: 0; transform: scale(.95); }
        .count { font-size: .85rem; color: #70757a; margin: 6px 0; }

        /* Keywords */
        .hl { font-size: 1.15rem; line-height: 2.2; }
        .hl span { cursor: pointer; padding: 4px 7px; border-radius: 8px; display: inline-block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        .hl span.sel { background: #fbbf24; font-weight: 800; }
        .hl span.good { background: #22c55e; color: #fff; font-weight: 800; }
        .hl span.okish { background: #bbf7d0; font-weight: 800; }
        .hl span.bad { background: #ef4444; color: #fff; font-weight: 800; }

        /* Quellen */
        .sites { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
        .site { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; touch-action: manipulation; }
        .site h4 { margin: 0 0 6px; font-size: 1rem; }
        .site p { font-size: .93rem; margin: 0 0 8px; }
        .site small { color: var(--muted); font-weight: 700; }
        .site.good { border-color: #22c55e; background: #f0fdf4; }
        .site.bad { border-color: #ef4444; background: #fff1f2; }
        .w5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
        .w5 div { background: #fff; border-radius: 12px; padding: 10px; font-size: .93rem; line-height: 1.35; border: 2px solid var(--line); }
        .w5 b { display: block; font-size: 1rem; }

        /* KI-Übersicht */
        .ki-box { background: linear-gradient(135deg, #eef2ff, #fdf4ff); border: 1px solid #ddd6fe; border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
        .ki-box .h { font-weight: 800; font-size: .9rem; color: #6d28d9; margin-bottom: 4px; }
        .ki-box .src { font-size: .78rem; color: var(--muted); margin-top: 6px; }

        /* Bildsuche */
        .post { background: #fff; border-radius: 16px; border: 1px solid var(--line); padding: 12px; max-width: 420px; margin: 0 auto; }
        .post svg { width: 100%; height: auto; border-radius: 12px; display: block; margin: 8px 0; }
        .post .h { font-weight: 800; font-size: .92rem; }

        /* Suchduell */
        .duel-card { background: linear-gradient(135deg, #312e81, #6d28d9); color: #fff; border-radius: 18px; padding: 18px; font-size: 1.2rem; font-weight: 800; text-align: center; min-height: 90px; display: flex; align-items: center; justify-content: center; }
        .stopw { font-size: 2rem; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; }
        table.res-t { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; font-size: .93rem; margin-top: 12px; }
        table.res-t td, table.res-t th { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }

        /* Vergleich */
        .eng { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 14px; }
        .eng.done { border-color: #22c55e; background: #f0fdf4; }
        .eng p { font-size: .97rem; }
        .eng .seg .choice { min-height: 44px; padding: 8px 10px; font-size: .92rem; }

        /* Webquest */
        .src-box { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
        .wchk { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .wchk label { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 10px; border-radius: 99px; border: 2px solid var(--line); font-weight: 750; font-size: .9rem; cursor: pointer; background: #fff; }
        .wchk input { width: 20px; height: 20px; accent-color: var(--accent); }
        textarea.txt { width: 100%; min-height: 90px; border-radius: 12px; border: 2px solid var(--line); padding: 10px 12px; font-size: 1.02rem; line-height: 1.45; resize: vertical; }
        textarea.txt:focus { outline: none; border-color: var(--accent); }
        .elogo { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; font-weight: 900; color: #fff; margin-right: 4px; vertical-align: middle; }
        .elogo.google { background: conic-gradient(#ea4335 0 25%, #fbbc05 0 50%, #34a853 0 75%, #4285f4 0); }
        .elogo.bing { background: linear-gradient(135deg, #00c8a0, #008373); }
        .elogo.qwant { background: #e11d48; }

    </style>
</head>
<body>
    <script>
        /* ===== Lern-Kit: Navigation, Speichern, Lerntagebuch, Mappe ===== */
        const K = (() => {
            let C, S, cur = 0, leave = [], saveT, toastT;
            const SOC = { EA: "👤 allein", PA: "👥 zu zweit", GA: "👪 in der Gruppe" };
            const el = id => document.getElementById(id);
            const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
            const strip = h => String(h).replace(/<[^>]+>/g, "");
            const fresh = () => ({ won: {}, answers: {}, results: {}, data: {}, stars: {}, reasons: {}, hooks: {}, last: 0 });
            const MINLEN = 15;   /* Pflicht-Einträge: mindestens ein ganzer Satz */
            function load() { try { return JSON.parse(localStorage.getItem(C.key)) || {}; } catch (e) { return {}; } }
            function save() { try { localStorage.setItem(C.key, JSON.stringify(S)); } catch (e) {} }
            const st = n => C.stations[n - 1];
            const ans = (s, j) => ((S.answers[s.id] || {})[j.id] || "");
            /* Satzanfang (ph) allein zählt nicht: dahinter muss etwas stehen */
            const starter = j => (j.ph || "").replace(/…\s*$/, "").trim();
            function okAns(s, j) {
                let t = ans(s, j).trim();
                const b = starter(j);
                if (b && t.startsWith(b)) return t.slice(b.length).trim().length >= 10;
                return t.length >= MINLEN;
            }
            function missing(s) {
                const m = [];
                if (s.mount && !S.won[s.id]) m.push(s.gameName || "Übung");
                if ((s.journal || []).some(j => j.req && !okAns(s, j))) m.push("Pflicht-Eintrag");
                return m;
            }
            const isDone = s => missing(s).length === 0;
            const starTotal = () => Object.values(S.stars).reduce((a, b) => a + b, 0);

            function init(course) {
                C = course;
                S = Object.assign(fresh(), load());
                S.reasons = S.reasons || {};
                S.hooks = S.hooks || {};
                document.title = C.title;
                document.body.insertAdjacentHTML("afterbegin", `
                    <header class="top">
                        <button class="brand" onclick="K.go(0)"><span class="ico">${C.icon}</span><span class="txt">${C.title}</span></button>
                        <div class="prog"><div class="track"><div class="fill" id="k-fill"></div></div><span class="num" id="k-num"></span></div>
                    </header>
                    <nav class="chips" id="k-chips"></nav>
                    <main id="k-main"></main>
                    <footer class="foot" id="k-foot"></footer>
                    <div class="toast" id="k-toast" role="status"></div>`);
                document.addEventListener("click", e => {
                    if (!e.target.closest(".vocab, .vtip")) closeTips();
                    /* Externe Links immer im Browser-Tab öffnen (auch als Home-Bildschirm-App) */
                    const a = e.target.closest("a[href^='http']");
                    if (a) { e.preventDefault(); window.open(a.href, "_blank", "noopener,noreferrer"); }
                });
                go(0);
            }

            function chips(scroll) {
                const n = C.stations.length;
                const list = C.stations.map((s, i) => {
                    const ok = isDone(s);
                    return `<button class="chip ${cur === i + 1 ? "on" : ""} ${ok ? "ok" : ""}" onclick="K.go(${i + 1})"><b>${ok ? "✓" : i + 1}</b><span>${s.nav}</span></button>`;
                }).join("");
                el("k-chips").innerHTML =
                    `<button class="chip home ${cur === 0 ? "on" : ""}" onclick="K.go(0)" aria-label="Startseite">🏠</button>${list}` +
                    `<button class="chip ${cur === "mappe" ? "on" : ""}" onclick="K.go('mappe')"><b>📒</b><span>Mappe</span></button>`;
                const done = C.stations.filter(isDone).length;
                el("k-fill").style.width = (done / n * 100) + "%";
                el("k-num").textContent = `${done}/${n}`;
                if (scroll) { const on = el("k-chips").querySelector(".chip.on"); if (on) on.scrollIntoView({ block: "nearest", inline: "center" }); }
            }

            function foot() {
                const f = el("k-foot"), n = C.stations.length;
                if (cur === 0) {
                    const resume = S.last && S.last !== "mappe" && S.last > 0 ? S.last : 0;
                    f.innerHTML = `<span class="mid"></span>
                        <button class="btn" onclick="K.go(${resume || 1})">${resume ? "Weiterarbeiten" : "Los geht’s"} →</button>`;
                    return;
                }
                if (cur === "mappe") {
                    f.innerHTML = `<button class="btn ghost" onclick="K.go(${n})">←<span class="hide-s"> Zurück</span></button><span class="mid"></span>
                        <button class="btn ghost" onclick="K.go(0)">🏠<span class="hide-s"> Start</span></button>`;
                    return;
                }
                const m = missing(st(cur));
                f.innerHTML = `<button class="btn ghost" onclick="K.go(${cur - 1})">←<span class="hide-s"> Zurück</span></button>
                    <span class="mid">${m.length ? "Noch offen: " + m.join(" + ") : "✅ Station erledigt"}</span>
                    <button class="btn ${m.length ? "" : "ok"}" onclick="K.next()">${cur === n ? "Zur Mappe" : "Weiter"} →</button>`;
            }

            function refresh() { chips(false); foot(); }

            function next() {
                const m = missing(st(cur));
                if (m.length) { toast("Erst noch: " + m.join(" + ") + (m.includes("Pflicht-Eintrag") ? ". Schreib mindestens einen ganzen Satz." : "")); return; }
                go(cur === C.stations.length ? "mappe" : cur + 1);
            }

            function go(n) {
                leave.forEach(f => { try { f(); } catch (e) {} });
                leave = [];
                cur = n;
                if (n !== 0) { S.last = n; save(); }
                if (n === 0) home(); else if (n === "mappe") mappe(); else station(n);
                el("k-main").scrollTop = 0;
                chips(true); foot();
            }

            function block(kind, icon, title, html) {
                return `<section class="block ${kind}"><div class="bh"><span class="bi">${icon}</span>${title}</div>${html}</section>`;
            }

            function plan(s, n, html) {
                const J = s.journal || [], nreq = J.filter(j => j.req).length, nopt = J.length - nreq;
                const part = (C.parts || []).find(p => n >= p.from && n <= p.to);
                const pf = [];
                if (s.mount) pf.push("🎮 " + s.gameName);
                if (nreq) pf.push("✏️ 1 Eintrag im Lerntagebuch");
                if (html.includes('block task')) pf.push("🌍 Auftrag im echten Internet");
                const zu = [];
                if (nopt) zu.push(`✏️ ${nopt === 1 ? "1 weiterer Eintrag" : nopt + " weitere Einträge"} im Lerntagebuch`);
                return `<div class="plan"><div>⏱ ca. ${s.time}${part ? " · " + part.label.split(" · ")[0] : ""}</div>
                    <div><span class="badge req">Pflicht</span> ${pf.join(" · ") || "–"}</div>
                    ${zu.length ? `<div><span class="badge opt">Zusatz</span> ${zu.join(" · ")}</div>` : ""}</div>`;
            }

            /* Hook: Vorhersagefrage vor der Erklärung. Nicht bewertet, blockiert nichts. */
            function hookBlock(s) {
                const h = s.hook;
                if (!h) return "";
                return `<section class="block hook" id="k-hook"><div class="bh"><span class="bi">🤔</span>Was glaubst du?</div>
                    <p><b>${h.q}</b></p>
                    <div>${h.opts.map((o, i) => `<button class="choice" data-h="${i}">${o[0]}</button>`).join("")}</div>
                    <div class="fb" id="k-hook-fb" role="status"></div>
                    <p class="hook-note" id="k-hook-note">Nur zum Nachdenken – das zählt nicht. <button class="linkish" id="k-hook-skip" type="button">Überspringen</button></p></section>`;
            }
            function hookMount(s) {
                const h = s.hook;
                if (!h) return;
                const root = el("k-hook"), learn = el("k-learn"), fbx = el("k-hook-fb");
                const show = i => {
                    const o = h.opts[i];
                    root.querySelectorAll(".choice").forEach((b, k) => {
                        b.disabled = true;
                        if (k === i) b.classList.add(o[1] === false ? "bad" : o[1] === true ? "good" : "pick");
                        else if (o[1] !== null && h.opts[k][1] === true) b.classList.add("good");
                    });
                    fbx.className = "fb show " + (o[1] === true ? "good" : o[1] === false ? "bad" : "info");
                    fbx.innerHTML = (o[1] === true ? "✓ Genau. " : o[1] === false ? "Nicht ganz. " : "") + (o[1] === true ? h.yes : o[1] === false ? h.no : (h.any || "Kein Problem. " + h.yes));
                    el("k-hook-note").style.display = "none";
                    if (learn) learn.open = true;
                };
                root.querySelectorAll(".choice").forEach(b => b.onclick = () => {
                    const i = +b.dataset.h;
                    S.hooks[s.id] = i; save();
                    show(i);
                    if (learn) learn.scrollIntoView({ block: "nearest", behavior: "smooth" });
                });
                el("k-hook-skip").onclick = () => { if (learn) { learn.open = true; learn.scrollIntoView({ block: "nearest", behavior: "smooth" }); } el("k-hook-note").style.display = "none"; };
                const done = S.hooks[s.id];
                if (typeof done === "number" && h.opts[done]) show(done);
                else if (learn) learn.open = false;
            }

            function station(n) {
                const s = st(n), html = s.body();
                el("k-main").innerHTML = `<div class="wrap">
                    <section class="s-hero">
                        <h1>${s.icon} ${s.title}</h1>
                        <p class="goal">🎯 ${s.goal}</p>
                    </section>
                    ${plan(s, n, html)}
                    ${hookBlock(s)}
                    ${html}
                    ${journal(s)}
                </div>`;
                hookMount(s);
                if (s.mount) s.mount(api(s));
                const hint = j => {
                    const h = el("k-main").querySelector(`[data-jh="${j.id}"]`), t = el("k-main").querySelector(`textarea[data-j="${j.id}"]`);
                    if (!h) return;
                    const sb = el("k-main").querySelector(`[data-st="${j.id}"]`);
                    if (sb) sb.style.display = t.value.trim() ? "none" : "";
                    if (!j.req) { h.textContent = ""; return; }
                    const good = okAns(s, j);
                    h.className = "jhint" + (good ? " ok" : "");
                    h.textContent = good ? "✓ Pflicht erledigt" : (t.value.trim() ? "Schreib mindestens einen ganzen Satz." : "");
                };
                (s.journal || []).forEach(j => {
                    const t = el("k-main").querySelector(`textarea[data-j="${j.id}"]`);
                    t.addEventListener("input", () => {
                        S.answers[s.id] = S.answers[s.id] || {};
                        S.answers[s.id][j.id] = t.value;
                        clearTimeout(saveT); saveT = setTimeout(save, 300);
                        hint(j); refresh();
                    });
                    const sb = el("k-main").querySelector(`[data-st="${j.id}"]`);
                    if (sb) sb.onclick = () => { t.value = starter(j) + " "; t.dispatchEvent(new Event("input")); t.focus(); t.setSelectionRange(t.value.length, t.value.length); };
                    hint(j);
                });
            }

            function journal(s) {
                const J = s.journal || [];
                if (!J.length) return "";
                const hasReq = J.some(j => j.req);
                return block("journal", "✏️", "Lerntagebuch",
                    `<p class="muted">${hasReq ? "<b>Ein Eintrag ist Pflicht</b> (mit rotem Schild). Die anderen sind freiwillig." : "Hier ist alles <b>freiwillig</b>."} Was du schreibst, landet in deiner <b>Mappe</b>.</p>` +
                    J.map(j => `<div class="jq ${j.req ? "req" : ""}"><label for="j-${s.id}-${j.id}">${j.req ? '<span class="badge req">Pflicht</span> ' : ""}${j.q}${j.req ? "" : ' <span class="muted">(freiwillig)</span>'}</label>
                        <textarea id="j-${s.id}-${j.id}" data-j="${j.id}" placeholder="${esc(j.ph || "")}">${esc(ans(s, j))}</textarea>
                        <div class="jtools">${j.ph ? `<button type="button" class="linkish" data-st="${j.id}">✍️ Satzanfang einfügen</button>` : ""}<span class="jhint" data-jh="${j.id}" role="status"></span></div></div>`).join(""));
            }

            function api(s) {
                return {
                    win(stars) {
                        const first = !S.won[s.id];
                        S.won[s.id] = true;
                        if (stars && stars > (S.stars[s.id] || 0)) S.stars[s.id] = stars;
                        save(); refresh();
                        if (first) toast("Übung erledigt." + (s.journal && s.journal.length ? " Jetzt noch das Lerntagebuch." : ""));
                    },
                    won: () => !!S.won[s.id],
                    result(t) { S.results[s.id] = t; save(); },
                    get(k) { return (S.data[s.id] || {})[k]; },
                    set(k, v) { S.data[s.id] = S.data[s.id] || {}; S.data[s.id][k] = v; save(); },
                    onLeave(f) { leave.push(f); },
                    toast
                };
            }

            function home() {
                const parts = C.parts || [{ label: "", from: 1, to: C.stations.length }];
                const card = (s, n) => `<button class="st-card ${isDone(s) ? "ok" : ""}" onclick="K.go(${n})">
                    <span class="n">${isDone(s) ? "✓" : s.icon}</span><span class="tx"><span class="t">${s.title}</span><span class="m">⏱ ca. ${s.time}</span></span></button>`;
                const mins = p => C.stations.slice(p.from - 1, p.to).reduce((a, s) => a + (parseInt(s.time, 10) || 0), 0);
                el("k-main").innerHTML = `<div class="wrap">
                    <section class="s-hero home-hero">
                        <div class="big-ico">${C.icon}</div>
                        <h1>${C.title}</h1>
                        <p class="lead">${C.lead}</p>
                        ${C.stars && starTotal() ? `<div class="stars-total">⭐ ${starTotal()}</div>` : ""}
                    </section>
                    ${parts.map(p => `${p.label ? `<div class="part-h">${p.label}<span class="part-t">Station ${p.from}${p.to > p.from ? "–" + p.to : ""} · ca. ${mins(p)} min</span></div>` : ""}<div class="home-grid">${C.stations.slice(p.from - 1, p.to).map((s, i) => card(s, p.from + i)).join("")}</div>`).join("")}
                    <p class="home-how">An jeder Station: erst eine Frage tippen, dann lesen, dann die Übung lösen. <b>Pflicht</b> sind die Übung und ein Lerntagebuch-Eintrag pro Doppelstunde – das steht an jeder Station. Alles andere ist <b>Zusatz</b>. Am Ende alles aus der 📒 Mappe als PDF sichern${C.submit ? " und " + C.submit : ""}.</p>
                    ${C.glossary ? `<details class="gloss"><summary>Begriffe</summary>${C.glossary.map(([w, d]) => `<p><b>${w}:</b> ${d}</p>`).join("")}</details>` : ""}
                    ${C.homeExtra || ""}
                    <p class="center"><button class="linkish" onclick="K.reset()">Alles löschen und neu anfangen</button></p>
                </div>`;
            }

            function mappe() {
                el("k-main").innerHTML = `<div class="wrap">
                    <section class="s-hero no-print">
                        <h1>📒 Meine Mappe</h1>
                        <p class="goal">Hier steht alles, was du herausgefunden und geschrieben hast.</p>
                        <div class="actions"><button class="btn white" onclick="K.copy()">📋 Alles kopieren</button><button class="btn white" onclick="window.print()">🖨️ Als PDF sichern</button></div>
                    </section>
                    <div class="print-only"><h1>${C.title} – Mappe</h1></div>
                    ${C.stations.map((s, i) => block("m-st", isDone(s) ? "✅" : s.icon, `${i + 1} · ${s.title}`,
                        (S.results[s.id] ? `<p class="m-res">📊 ${esc(S.results[s.id])}</p>` : "") +
                        (S.reasons[s.id] || []).map(r => `<div class="m-q"><b>Begründung: ${esc(r.q)}</b><p>${esc(r.a)}</p></div>`).join("") +
                        ((s.journal || []).map(j => `<div class="m-q"><b>${j.q}</b><p>${esc(ans(s, j).trim()) || '<span class="muted">${j.req ? "– noch leer –" : "– freiwillig, nicht ausgefüllt –"}</span>'}</p></div>`).join("") ||
                            (S.results[s.id] || (S.reasons[s.id] || []).length ? "" : '<p class="muted">Hier gibt es nichts zu schreiben.</p>')))).join("")}
                    <section class="block no-print"><details><summary>📄 So sicherst du die PDF auf dem iPad</summary>
                        <ol class="steps">
                            <li>Tippe oben auf <b>🖨️ Als PDF sichern</b>.</li>
                            <li>Im Druck-Fenster oben auf das <b>Teilen-Symbol</b> (Kasten mit Pfeil) tippen.</li>
                            <li><b>In Dateien sichern</b> wählen und als Namen <i>${C.title}</i> eingeben.</li>
                            ${C.submit ? `<li>Die PDF ${C.submit}.</li>` : ""}
                        </ol>
                        <p class="muted">Oder: <b>Alles kopieren</b> und in Pages oder Goodnotes einfügen.</p>
                    </details></section>
                </div>`;
            }

            function copy() {
                let t = C.title + " – Mappe\n\n";
                C.stations.forEach((s, i) => {
                    t += `${i + 1}. ${strip(s.title)}\n`;
                    if (S.results[s.id]) t += "Ergebnis: " + S.results[s.id] + "\n";
                    (S.reasons[s.id] || []).forEach(r => { t += "• Begründung: " + r.q + "\n  " + r.a + "\n"; });
                    (s.journal || []).forEach(j => { t += "• " + strip(j.q) + "\n  " + (ans(s, j).trim() || "–") + "\n"; });
                    t += "\n";
                });
                const ok = () => toast("📋 Kopiert! Jetzt in Pages oder Goodnotes einfügen.");
                const fallback = () => {
                    const a = document.createElement("textarea");
                    a.value = t; a.setAttribute("readonly", ""); a.style.position = "fixed"; a.style.opacity = "0";
                    document.body.appendChild(a); a.select(); a.setSelectionRange(0, t.length);
                    try { document.execCommand("copy"); ok(); } catch (e) { toast("Kopieren ging nicht – nimm „Als PDF sichern“."); }
                    a.remove();
                };

                        <div class="field src-box"><label>6 · Partner-Check – gib dein iPad deinem Partner. Er oder sie tippt an, was stimmt:</label>
                            <div class="wchk">${PC.map((p, i) => `<label><input type="checkbox" data-pc="${i}" ${wq.pc.includes(i) ? "checked" : ""}>${p}</label>`).join("")}</div>
                            <textarea class="txt" id="wq-pt" style="margin-top:8px" placeholder="Tipp vom Partner: Was ist gut, was sollte noch besser werden?">${K.esc(wq.ptipp)}</textarea>
                            <div class="wchk"><label><input type="checkbox" id="wq-pd" ${wq.pdone ? "checked" : ""}>Ich habe als Partner alles geprüft.</label></div></div>
                        <div class="actions center"><button class="btn" id="wq-ok">✅ Webquest prüfen</button></div>`;
                    document.getElementById("wq-f").oninput = e => { wq.frage = e.target.value; save(); };
                    document.getElementById("wq-k").oninput = e => { wq.kw = e.target.value; save(); };
                    document.getElementById("wq-a").oninput = e => { wq.antwort = e.target.value; save(); };
                    document.getElementById("wq-pt").oninput = e => { wq.ptipp = e.target.value; save(); };
                    g.querySelectorAll("[data-sc]").forEach(c => c.onchange = () => { const i = +c.dataset.sc; wq.sc = wq.sc.filter(x => x !== i); if (c.checked) wq.sc.push(i); save(); });
                    document.getElementById("wq-pd").onchange = e => { wq.pdone = e.target.checked; save(); };
                    g.querySelectorAll("[data-pc]").forEach(c => c.onchange = () => { const i = +c.dataset.pc; wq.pc = wq.pc.filter(x => x !== i); if (c.checked) wq.pc.push(i); save(); });
                    g.querySelectorAll("[data-src]").forEach(inp => inp.oninput = () => { wq.src[+inp.dataset.src].n = inp.value; save(); });
                    g.querySelectorAll("[data-w]").forEach(c => c.onchange = () => {
                        const s = wq.src[+c.dataset.s], k = s.w.indexOf(c.dataset.w);
                        if (c.checked && k < 0) s.w.push(c.dataset.w); if (!c.checked && k >= 0) s.w.splice(k, 1); save();
                    });
                    document.getElementById("wq-ok").onclick = () => {
                        const named = wq.src.filter(s => s.n.trim());
                        if (wq.frage.trim().length < 5) return fb("Schreib zuerst deine Frage auf.", false);
                        if (!wq.kw.trim()) return fb("Trag deine Suchwörter ein.", false);
                        if (named.length < 2) return fb("Du brauchst mindestens 2 Quellen.", false);
                        if (named.some(s => s.w.length < 3)) return fb("Jede Quelle sollte mindestens 3 der 5 W erfüllen. Such sonst eine bessere Quelle.", false);
                        if (wq.antwort.trim().length < 20) return fb("Schreib deine Antwort in ein bis zwei ganzen Sätzen.", false);
                        if (wq.sc.length < SC.length) return fb("Geh den Selbst-Check (Schritt 5) durch. Stimmt etwas noch nicht? Dann verbessere es zuerst.", false);
                        if (wq.ptipp.trim().length < 10 || !wq.pdone) return fb("Jetzt ist dein Partner dran (Schritt 6): Kriterien antippen, einen Tipp schreiben und „alles geprüft“ ankreuzen.", false);
                        if (wq.pc.length < 3) return fb("Dein Partner hat weniger als 3 Kriterien angetippt. Verbessere noch etwas und lass noch einmal prüfen.", false);
                        fb("✓ Dein Webquest ist vollständig und steht jetzt in deiner Mappe.", true);
                        api.result(`Frage: ${wq.frage.trim()} · Suchwörter: ${wq.kw.trim()} · Quellen: ${named.map(s => `${s.n.trim()} (${s.w.join(", ")})`).join("; ")} · Antwort: ${wq.antwort.trim()} · Selbst-Check: ${wq.sc.length} von ${SC.length} · Partner-Check: ${wq.pc.map(i => PC[i]).join(", ") || "–"}; Tipp: ${wq.ptipp.trim()}`);
                        api.win(3);
                    };
                },
                journal: [{ id: "a", req: true, ph: "Ich bin mir sicher, weil …", q: "Bist du dir sicher, dass deine Antwort stimmt? Woran machst du das fest?" }]
            }
        ];

        K.init({
            key: "search_course_v14",
            title: "Suchmaschinen kennenlernen",
            icon: "🔍",
            lead: "Wie findet Google in einer halben Sekunde Millionen Treffer – und welchen davon kannst du trauen? In 10 Stationen lernst du, gezielt zu suchen, Fakes und Werbung zu erkennen und KI-Antworten zu prüfen.",
            duration: "3 Doppelstunden",
            stars: true,
            submit: "bei itslearning hochladen",
            parts: [
                { label: "Doppelstunde 1 · Wie Suchen funktioniert", from: 1, to: 4 },
                { label: "Doppelstunde 2 · Suchen wie ein Profi", from: 5, to: 8 },
                { label: "Doppelstunde 3 · Vergleichen & Abschluss-Projekt", from: 9, to: 10 }
            ],
            glossary: [
                ["Crawler", "Programm, das Webseiten besucht und liest."],
                ["Index", "Der Katalog aller gelesenen Webseiten."],
                ["Gesponsert", "Bezahlte Anzeige in den Suchergebnissen."],
                ["Organischer Treffer", "Normales Ergebnis, für das niemand bezahlt hat."],
                ["Keyword", "Schlüsselwort für die Suche."],
                ["Operator", "Zeichen oder Befehl, der die Suche genauer macht, z. B. Anführungszeichen oder site:."],
                ["Rückwärtssuche", "Mit einem Bild statt mit Wörtern suchen."],
                ["Impressum", "Angabe, wer für eine Webseite verantwortlich ist."],
                ["Halluzinieren", "Wenn eine KI etwas Falsches überzeugt behauptet."]
            ],
            stations: STATIONS
        });

    </script>
</body>
</html>
